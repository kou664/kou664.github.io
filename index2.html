<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAEHA'S FRUIT WORLD</title>
 
<style>
:root {
  --orange: #ff7139;
  --pink: #ff80a8;
  --yellow: #ffdf57;
  --lime: #c8f36b;
  --purple: #b69aff;
  --cream: #fff9ed;
  --green: #244a35;
}
 
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
 
html {
  scroll-behavior: smooth;
}
 
body {
  background: var(--cream);
  color: var(--green);
  font-family: "Trebuchet MS", "Helvetica Neue",
               Arial, sans-serif;
  overflow-x: hidden;
}
 
a {
  color: inherit;
  text-decoration: none;
}
 
button, input, textarea {
  font: inherit;
}
 
button {
  cursor: pointer;
}
 
/* NAVIGATION */
 
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 6%;
  background: var(--cream);
  border-bottom: 2px solid var(--green);
  position: sticky;
  top: 0;
  z-index: 100;
}
 
.brand {
  font-size: 18px;
  font-weight: 1000;
  letter-spacing: -1px;
}
 
.brand span {
  color: var(--orange);
}
 
.nav-links {
  display: flex;
  gap: 22px;
  font-size: 11px;
  font-weight: bold;
}
 
.nav-links a:hover {
  color: var(--orange);
}
 
/* HERO */
 
.hero {
  min-height: 650px;
  padding: 85px 8%;
  background: var(--yellow);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
}
 
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 800px;
  animation: slideIn 1s ease both;
}
 
.eyebrow {
  display: inline-block;
  background: var(--green);
  color: white;
  padding: 8px 16px;
  border-radius: 50px;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 25px;
}
 
.hero h1 {
  font-size: clamp(55px, 10vw, 125px);
  font-weight: 1000;
  line-height: .88;
  letter-spacing: -6px;
}
 
.hero h1 span {
  color: var(--orange);
  -webkit-text-stroke: 2px var(--green);
  paint-order: stroke fill;
}
 
.hero-description {
  max-width: 400px;
  font-size: 14px;
  line-height: 2;
  margin-top: 30px;
}
 
.hero-button {
  display: inline-block;
  background: var(--green);
  color: white;
  padding: 15px 25px;
  border-radius: 50px;
  margin-top: 28px;
  font-size: 12px;
  font-weight: bold;
  transition: .3s;
}
 
.hero-button:hover {
  transform: translateY(-5px) rotate(-2deg);
  box-shadow: 5px 7px 0 var(--orange);
}
 
.fruit {
  position: absolute;
  font-size: clamp(55px, 9vw, 110px);
  animation: float 5s ease-in-out infinite;
  user-select: none;
}
 
.fruit-one {
  top: 12%;
  right: 13%;
}
 
.fruit-two {
  right: 26%;
  bottom: 12%;
  animation-delay: -2s;
}
 
.fruit-three {
  right: 5%;
  bottom: 30%;
  animation-delay: -3s;
}
 
.fruit-four {
  right: 42%;
  top: 8%;
  font-size: 45px;
  animation-delay: -1s;
}
 
/* TICKER */
 
.ticker {
  overflow: hidden;
  white-space: nowrap;
  background: var(--orange);
  color: white;
  padding: 15px 0;
  font-size: 13px;
  font-weight: 1000;
  letter-spacing: 3px;
}
 
.ticker-inner {
  display: inline-block;
  animation: ticker 24s linear infinite;
}
 
/* SECTION */
 
section {
  padding: 95px 8%;
}
 
.section-heading {
  margin-bottom: 40px;
}
 
.section-heading small {
  font-size: 11px;
  letter-spacing: 4px;
  font-weight: bold;
  color: var(--orange);
}
 
.section-heading h2 {
  font-size: clamp(35px, 6vw, 65px);
  letter-spacing: -2px;
  line-height: 1.2;
  margin-top: 10px;
}
 
.section-heading p {
  margin-top: 12px;
  color: #71806d;
  font-size: 13px;
  line-height: 1.9;
}
 
/* PROFILE */
 
.profile {
  background: var(--cream);
}
 
.profile-intro {
  background: white;
  border: 2px solid var(--green);
  border-radius: 30px;
  padding: 35px;
  box-shadow: 7px 7px 0 var(--lime);
  margin-bottom: 35px;
}
 
.profile-intro h3 {
  font-size: 25px;
  margin-bottom: 12px;
}
 
.profile-intro p {
  font-size: 14px;
  line-height: 2;
  color: #68796b;
}
 
.profile-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
 
.profile-card {
  padding: 25px;
  border: 2px solid var(--green);
  border-radius: 24px;
  transition: .3s;
}
 
.profile-card:nth-child(1) {
  background: var(--pink);
}
 
.profile-card:nth-child(2) {
  background: var(--lime);
}
 
.profile-card:nth-child(3) {
  background: var(--purple);
}
 
.profile-card:hover {
  transform: translateY(-8px) rotate(-1deg);
}
 
.profile-card .icon {
  font-size: 35px;
}
 
.profile-card small {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 18px;
}
 
.profile-card h3 {
  font-size: 18px;
  margin-top: 5px;
}
 
.profile-card p {
  font-size: 11px;
  margin-top: 5px;
}
 
/* TRAINING */
 
.training {
  background: var(--green);
  color: white;
}
 
.training .section-heading small {
  color: var(--lime);
}
 
.training .section-heading p {
  color: #c6d8c8;
}
 
.training-main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-radius: 30px;
  overflow: hidden;
  border: 2px solid var(--lime);
}
 
.training-visual {
  background: var(--orange);
  color: var(--green);
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 110px;
}
 
.training-text {
  padding: 35px;
  background: #315640;
}
 
.training-text small {
  color: var(--lime);
  letter-spacing: 3px;
  font-size: 10px;
}
 
.training-text h3 {
  font-size: 32px;
  margin: 15px 0;
}
 
.training-text p {
  font-size: 13px;
  line-height: 2;
  color: #d3e1d3;
}
 
/* MANGA */
 
.manga {
  background: var(--pink);
}
 
.manga .section-heading small {
  color: #7c3d4f;
}
 
.manga-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}
 
.manga-toolbar p {
  font-size: 12px;
}
 
.add-button {
  border: 2px solid var(--green);
  background: var(--yellow);
  color: var(--green);
  border-radius: 50px;
  padding: 13px 20px;
  font-size: 12px;
  font-weight: bold;
  transition: .25s;
}
 
.add-button:hover {
  background: var(--green);
  color: white;
  transform: rotate(-2deg);
}
 
.manga-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}
 
.manga-card {
  background: var(--cream);
  border: 2px solid var(--green);
  border-radius: 24px;
  overflow: hidden;
  transition: .3s;
  min-width: 0;
}
 
.manga-card:hover {
  transform: translateY(-7px) rotate(-1deg);
  box-shadow: 7px 7px 0 var(--green);
}
 
.manga-cover {
  height: 230px;
  background: var(--lime);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
 
.manga-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
 
.cover-placeholder {
  text-align: center;
  padding: 20px;
}
 
.cover-placeholder span {
  font-size: 55px;
  display: block;
  margin-bottom: 10px;
}
 
.cover-placeholder p {
  font-size: 11px;
  font-weight: bold;
}
 
.upload-label {
  display: inline-block;
  margin-top: 10px;
  background: white;
  border: 1px solid var(--green);
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 10px;
  cursor: pointer;
}
 
.upload-label:hover {
  background: var(--yellow);
}
 
.file-input {
  display: none;
}
 
.manga-info {
  padding: 20px;
}
 
.manga-info small {
  color: #8c8d70;
  font-size: 10px;
  letter-spacing: 2px;
}
 
.manga-info input,
.manga-info textarea {
  width: 100%;
  border: 1px solid #deded0;
  background: white;
  color: var(--green);
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
  outline-color: var(--orange);
}
 
.manga-info input {
  font-weight: bold;
}
 
.manga-info textarea {
  resize: vertical;
  min-height: 80px;
  font-size: 12px;
  line-height: 1.7;
}
 
.remove-button {
  background: transparent;
  color: #a14454;
  border: none;
  margin-top: 12px;
  font-size: 11px;
  text-decoration: underline;
}
 
/* FAVORITES */
 
.favorites {
  background: var(--lime);
}
 
.favorite-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
 
.favorite-card {
  background: white;
  padding: 28px;
  border: 2px solid var(--green);
  border-radius: 25px;
  min-height: 180px;
  transition: .3s;
}
 
.favorite-card:hover {
  transform: scale(1.03);
  box-shadow: 5px 5px 0 var(--green);
}
 
.favorite-card .icon {
  font-size: 35px;
}
 
.favorite-card h3 {
  margin-top: 14px;
  font-size: 17px;
}
 
.favorite-card p {
  color: #71806d;
  font-size: 12px;
  margin-top: 5px;
}
 
/* FOOTER */
 
footer {
  padding: 65px 8%;
  background: var(--orange);
  text-align: center;
  color: var(--green);
}
 
footer h2 {
  font-size: clamp(30px, 7vw, 65px);
  font-weight: 1000;
  letter-spacing: -2px;
}
 
footer p {
  font-size: 12px;
  margin-top: 15px;
}
 
.back-top {
  display: inline-block;
  margin-top: 25px;
  background: var(--green);
  color: white;
  border-radius: 50px;
  padding: 13px 25px;
  font-size: 11px;
}
 
/* ANIMATIONS */
 
.fade-in {
  opacity: 0;
  transform: translateY(25px);
  transition: opacity .8s, transform .8s;
}
 
.fade-in.show {
  opacity: 1;
  transform: translateY(0);
}
 
@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(-8deg);
  }
  50% {
    transform: translateY(-25px) rotate(8deg);
  }
}
 
@keyframes ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
 
@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
 
/* MOBILE */
 
@media (max-width: 700px) {
  nav {
    padding: 16px 5%;
  }
 
  .nav-links {
    gap: 12px;
    font-size: 9px;
  }
 
  .hero {
    min-height: 600px;
    padding: 75px 7%;
  }
 
  .hero h1 {
    letter-spacing: -3px;
  }
 
  .fruit-one {
    right: 7%;
    top: 12%;
  }
 
  .fruit-two {
    right: 8%;
    bottom: 8%;
  }
 
  .fruit-three {
    right: 12%;
    bottom: 32%;
  }
 
  section {
    padding: 70px 6%;
  }
 
  .profile-grid,
  .favorite-grid {
    grid-template-columns: 1fr;
  }
 
  .training-main {
    grid-template-columns: 1fr;
  }
 
  .training-visual {
    min-height: 210px;
  }
 
  .manga-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
 
  .manga-cover {
    height: 180px;
  }
 
  .manga-info {
    padding: 12px;
  }
 
  .manga-info input,
  .manga-info textarea {
    padding: 8px;
    font-size: 11px;
  }
}
 
@media (max-width: 390px) {
  .manga-grid {
    grid-template-columns: 1fr;
  }
 
  .manga-cover {
    height: 260px;
  }
}
 
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
 
  .fruit,
  .ticker-inner,
  .hero-content {
    animation: none;
  }
 
  .fade-in {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>
 
<body id="top">
 
<nav>
  <a href="#top" class="brand">SAEHA<span>✳</span>WORLD</a>
 
  <div class="nav-links">
    <a href="#profile">PROFILE</a>
    <a href="#training">TRAINING</a>
    <a href="#manga">MANGA</a>
    <a href="#favorites">FAVORITES</a>
  </div>
</nav>
 
<!-- HERO -->
 
<header class="hero">
  <div class="hero-content">
    <div class="eyebrow">WELCOME TO MY WORLD 🍊</div>
 
    <h1>SAEHA'S<br><span>FRUIT WORLD.</span></h1>
 
    <p class="hero-description">
      18 YEARS OLD · SHIMANE, JAPAN<br>
      筋トレと漫画が好きな大学生。<br>
      好きなものを、好きな色で。
    </p>
 
    <a href="#profile" class="hero-button">
      DISCOVER MY WORLD ↓
    </a>
  </div>
 
  <div class="fruit fruit-one">🍊</div>
  <div class="fruit fruit-two">🍓</div>
